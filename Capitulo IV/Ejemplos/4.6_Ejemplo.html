<!DOCTYPE html>
<!-- Fig 4.9: posicionamiento.html -->
<!-- Posicionamiento absoluto de los elementos. -->

<html>
   <head>
      <meta charset="utf-8">
      <title>Posicionamiento absoluto</title>
      <style type="text/css">
         
         .contenedor-imagenes {
            position: relative;
            width: 600px; 
            height: 400px; 
            margin-bottom: 20px;
         }

         .imagen_fondo { 
            position: absolute;
            top: 0px;
            left: 0px;
            z-index: 1; 
         }

         .imagen_primerplano { 
            position: absolute;
            top: 25px;
            left: 100px;
            z-index: 2; 
         }

         .texto { 
            position: absolute;
            top: 25px;
            left: 100px;
            z-index: 3;
            font-size: 20pt;
            font-family: tahoma, geneva, sans-serif; 
         }

      </style>
   </head>
   <body>

      <h1>Ejemplo 4.9: posicionamiento.html</h1>
      <hr>

      <!-- Contenedor que evita que los elementos absolutos invadan la parte inferior -->
      <div class="contenedor-imagenes">
         <img src="../Source/imagen_fondo.png" class="imagen_fondo" alt="Primer imagen posicionada" />
         <img src="../Source/imagen_primerplano.png" class="imagen_primerplano" alt="Segunda imagen posicionada" />
         <p class="texto">Texto posicionado</p>
      </div>

      <!-- Zona de botones separada y ordenada -->
      <hr>
      <link rel="stylesheet" href="../Source/Botones.css">
      <div class="botones-navegacion">
         <a href="../index.html" class="btn">Menú principal IV</a>
         <a href="4.5_Ejemplo.html" class="btn">Anterior</a>
         <a href="4.7_Ejemplo.html" class="btn">Siguiente</a>
      </div>

   </body>
</html>
