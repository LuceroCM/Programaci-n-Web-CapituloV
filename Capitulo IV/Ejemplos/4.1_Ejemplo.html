<!DOCTYPE html>

<!-- Fig. 4.1: enlinea.html -->
<!-- Uso de estilos en linea -->
<html>
    <head>
        <meta charset = "utf-8">
        <title> Estilos en l&iacute;nea</title>
    </head>
    <body>

        <h1> Ejemplo 4.1: enlinea.html</h1>

      <hr>
        <p>Este texto no tiene aplicado ning&uacute;n estilo.</p>

        <!-- El atributo style nos permite declarar -->
        <!-- estilos en linea. Debemos separar varias -->
        <!-- propiedades de style con un punto y coma. -->
        <p style = "font-size: 20pt;">Este tetxo tiene aplicado el estilo
            <em>font-size</em>, para que sea de 20pt.
        </p>

        <p style = "font-size: 20pt; color: deepskyblue;">
            Este texto tiene aplicados el estilos <em>font-size</em> y 
            <em>color </em>, para que sea de 20pt 
            y de color azul cielo profundo.
        </p>

        <hr>

            <a href="../index.html" class="btn">Menú principal IV</a>
            <a href="4.2_Ejemplo.html" class="btn">Siguiente</a>
        </div>
    </body>
</html>
