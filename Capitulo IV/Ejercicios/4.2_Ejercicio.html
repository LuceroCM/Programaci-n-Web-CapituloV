        <h1>Ejercicio 4.2: Completar oraciones</h1>
      <hr>

        <form>
            <p>
                <label>
                    <strong>a)</strong> Mediante el elemento
                    <input type="text" value="vinculo" size="5" readonly>
                    es posible usar hojas de estilo externas en sus p&aacute;ginas 
                </label>
            </p>

            <p>
                <label>
                    <strong>b)</strong> Para aplicar una regla de CSS a m&aacute;s de un elemento a la vez, 
                    separe los nombres de los elementos con un(a)
                    <input type="text" value="coma" size="5" readonly>  
                </label>
            </p>

            <p>
                <label>
                    <strong>c)</strong> Los p&iacute;xeles son una unidad de medici&oacute;n de longitud 
                    <input type="text" value="relativo" size="5" readonly> 
                </label>
            </p>

            <p>
                <label>
                    <strong>d)</strong> La subclase
                    <input type="text" value=":hover" size="4" readonly>

                </label>
            </p>

            <p>
                <label>
                    <strong>e)</strong> Al establecer la propiedad 
                    <input type="text" value="overflow" size="5" readonly>

                    sin comprometer las dimensiones de un elemento.
                </label>
            </p>

            <p>

                    <strong>f)</strong>  
                    <input type="text" value="span" size="3" readonly>

                    <input type="text" value="div" size="3" readonly>

            </p>

            <p>
                <label>

                    <input type="text" value="repeat-y" size="5" readonly>

                </label>
            </p>

            <p>
                <label>

                    <input type="text" value="@media" size="5" readonly>

                </label>
            </p>

            <p>
                <label>
                    <strong>i)</strong> La propiedad 
                    <input type="text" value=" text-indent" size="5" readonly>
