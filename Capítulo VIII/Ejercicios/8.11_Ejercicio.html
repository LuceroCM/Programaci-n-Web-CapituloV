<!DOCTYPE html>

<!-- Ejercicio 8.11: ej08_11.html -->
<!-- Calcula el total vendido usando un ciclo centinela (-1) y un switch -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 8.11 - Calculadora de Ventas</title>
        <h1>Ejercicio 8.11: Calcula el total vendido usando un ciclo centinela (-1) y un switch</h1>
        <hr>
        <script>
            var totalVentas = 0;
            var producto = parseInt( window.prompt( "Ingrese número de producto (1-5) o -1 para terminar:", "1" ) );

            while ( producto !== -1 )
            {
                if ( producto >= 1 && producto <= 5 )
                {
                    var cantidad = parseInt( window.prompt( "Ingrese la cantidad vendida:", "1" ) );
                    var precio = 0;

                    switch ( producto )
                    {
                        case 1: precio = 2.98; break;
                        case 2: precio = 4.50; break;
                        case 3: precio = 9.98; break;
                        case 4: precio = 4.49; break;
                        case 5: precio = 6.87; break;
                    }

                    totalVentas += precio * cantidad;
                }
                else
                {
                    alert( "Número de producto inválido. Intente nuevamente." );
                }

                producto = parseInt( window.prompt( "Ingrese número de producto (1-5) o -1 para terminar:", "1" ) );
            }

            document.writeln( "<h1>El valor total de las ventas retail es: $" + totalVentas.toFixed(2) + "</h1>" );
        </script>
    </head>
    <body>
        <hr>
        <link rel="stylesheet" href="/Capitulo IV/Source/Botones.css">

            <a href="8.12_Ejercicio.html" class="btn">Siguiente</a>
        </div>
    </body>
</html>
