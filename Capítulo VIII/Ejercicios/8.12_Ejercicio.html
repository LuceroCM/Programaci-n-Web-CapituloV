        <h1>Ejercicio 8.12: Demostración del valor booleano de cada expresión lógica</h1>
        <hr>
        <script>
            var i = 1, j = 2, k = 3, m = 2;

            document.writeln( "<p>a) (i == 1): " + ( i == 1 ) + "</p>" );
            document.writeln( "<p>b) (j == 3): " + ( j == 3 ) + "</p>" );
            document.writeln( "<p>c) (i >= 1 && j < 4): " + ( i >= 1 && j < 4 ) + "</p>" );
            document.writeln( "<p>d) (m <= 99 && k < m): " + ( m <= 99 && k < m ) + "</p>" );
            document.writeln( "<p>e) (j >= i || k == m): " + ( j >= i || k == m ) + "</p>" );
            document.writeln( "<p>f) (k + m < j || 3 - j >= k): " + ( k + m < j || 3 - j >= k ) + "</p>" );
            document.writeln( "<p>g) (!(k > m)): " + ( !(k > m) ) + "</p>" );
        </script>
