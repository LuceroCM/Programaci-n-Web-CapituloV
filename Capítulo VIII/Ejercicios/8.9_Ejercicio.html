<!DOCTYPE html>

<!-- Ejercicio 8.9: ej08_09.html -->
<!-- Solicita 5 números e imprime líneas con su equivalente en asteriscos -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 8.9 - Histograma</title>
        <h1>Ejercicio 8.9: Solicita 5 números e imprime líneas con su equivalente en asteriscos</h1>
        <hr>
        
        <script>
            var numero;

            for ( var i = 1; i <= 5; ++i )
            {
                numero = parseInt( window.prompt( "Ingrese el número " + i + " (entre 1 y 30):", "1" ) );

                if ( !isNaN(numero) && numero >= 1 && numero <= 30 )
                {
                    document.write( "<p style='font-family: monospace; font-size: 16px; margin: 2px 0;'>" );
                    for ( var j = 1; j <= numero; ++j )
                    {
                        document.write( "*" );
                    }
                    document.writeln( " (" + numero + ")</p>" );
                }
                else
                {
                    document.writeln( "<p>Número inv&aacute;lido (debe estar entre 1 y 30)</p>" );
                }
            }
        </script>
    </head>

</html>
