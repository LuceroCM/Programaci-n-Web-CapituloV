    <head>
        <meta charset="utf-8">
        <title>Ejercicio 8.5 - Tabla Misteriosa</title>
        <h1>Ejercicio 8.5: ¿Qué hace el programa?</h1>
        <hr>
        <style type="text/css">
            table { border-collapse: collapse; }
            td { border: 1px solid black; padding: 5px; text-align: center; }
        </style>
        <script>
            document.writeln( "<table>" );

            for ( var i = 1; i <= 10; i++ )
            {
                document.writeln( "<tr>" );

                for ( var j = 1; j <= 5; j++ )
                    document.writeln( "<td>(" + i + ", " + j + ")</td>" );

                document.writeln( "</tr>" );
            } // fin de for

            document.writeln( "</table>" );
        </script>
    </head>
