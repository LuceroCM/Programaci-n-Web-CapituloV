<!DOCTYPE html>

<!-- Ejercicio 8.7: Producto de impares -->
<!-- Calcula el producto de los números impares del 1 al 15 -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 8.7: Producto de impares</title>
        <h1>Ejercicio 8.7: Calcula el producto de los números impares del 1 al 15</h1>
        <hr>
        <script>
            var producto = 1;

            for ( var i = 1; i <= 15; i += 2 )
            {
                producto *= i;
            }

            document.writeln( "<h1>El producto de los enteros impares del 1 al 15 es: " + producto + "</h1>" );
        </script>
    </head>

</html>
