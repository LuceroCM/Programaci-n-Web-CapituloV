<!DOCTYPE html>

<!-- Ejercicio 8.8: Interés Compuesto -->
<!-- Genera tablas de interés compuesto para tasas del 5% al 10% -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 8.8: Interés Compuesto para Múltiples Tasas</title>
        <h1>Ejercicio 8.8: Genera tablas de interés compuesto para tasas del 5% al 10%</h1>
        <hr>

        <style type="text/css">
            table { width: 320px; border-collapse: collapse; margin-bottom: 20px; background-color: lightblue; }
            table, td, th { border: 1px solid black; padding: 4px; }
            th { text-align: left; color: white; background-color: darkblue; }
            tr.filaimpar { background-color: white; }
        </style>
        <script>
            var principal = 1000.00;

            for ( var tasaEntera = 5; tasaEntera <= 10; ++tasaEntera )
            {
                var tasa = tasaEntera / 100;
                document.writeln( "<table>" );
                document.writeln( "<caption>C&aacute;lculo del inter&eacute;s compuesto (Tasa: " + tasaEntera + "%)</caption>" );
                document.writeln( "<thead><tr><th>A&ntilde;o</th><th>Monto en dep&oacute;sito</th></tr></thead><tbody>" );

                for ( var anio = 1; anio <= 10; ++anio )
                {
                    var monto = principal * Math.pow( 1.0 + tasa, anio );
                    if ( anio % 2 !== 0 )
                        document.writeln( "<tr class='filaimpar'><td>" + anio + "</td><td>" + monto.toFixed(2) + "</td></tr>" );
                    else
                        document.writeln( "<tr><td>" + anio + "</td><td>" + monto.toFixed(2) + "</td></tr>" );
                }

                document.writeln( "</tbody></table>" );
            }
        </script>
    </head>
    <body>
        <hr>
        <link rel="stylesheet" href="/Capitulo IV/Source/Botones.css">
        <div class="botones-navegacion">
            <a href="../indexVIII.html" class="btn">Menú principal VIII</a>
            <a href="8.7_Ejercicio.html" class="btn">Anterior</a>
            <a href="8.9_Ejercicio.html" class="btn">Siguiente</a>
        </div>
    </body>
</html>
