<!-- Ejercicio 7.4: Tareas básicas en JavaScript -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 7.4</title>
    </head>

    <body>
        <h1>Ejercicio 7.4: Tareas básicas en JavaScript</h1>
        <hr>

        <form>
            <p>
                <strong>Escriba una instrucción en JavaScript para realizar cada una de las siguientes tareas:</strong>
            </p>

            <p>
                <label>
                    <strong>a)</strong> Declarar las variables suma y x:<br>
                    <input type="text" value="var suma, x;" size="25" readonly>
                </label>
            </p>

            <p>
                <label>
                    <strong>b)</strong> Asignar 1 a la variable x:<br>
                    <input type="text" value="x = 1;" size="20" readonly>
                </label>
            </p>

            <p>
                <label>
                    <strong>c)</strong> Asignar 0 a la variable suma:<br>
                    <input type="text" value="suma = 0;" size="20" readonly>
                </label>
            </p>

            <p>
                <label>
                    <strong>d)</strong> Sumar la variable x a suma y asignar el resultado a la variable suma:<br>
                    <input type="text" value="suma += x; (o suma = suma + x;)" size="35" readonly>
                </label>
            </p>

            <p>
                <label>
                    <strong>e)</strong> Imprimir "La suma es: ", seguido del valor de la variable suma:<br>
                    <input type="text" value="document.writeln( &quot;La suma es: &quot;, + suma );" size="45" readonly>
                </label>
            </p>
        </form>

        </div>
    </body>
</html>
