    <body>
        <h1>Ejercicio 7.3: Tareas en JavaScript</h1>
        <hr>

        <form>
            <p>
                <strong>Escriba instrucciones en JavaScript para realizar cada una de las siguientes tareas[cite: 8]:</strong>
            </p>

            <p>
                <label>
                    <strong>a)</strong> Asignar la suma de x y y a z, e incrementar el valor de x en 1 despu&eaacute;s del c&aacute;lculo. Usar s&oacute;lo una instrucci&oacute;n:<br>
                    <input type="text" value="z = x++ + y;" size="25" readonly>
                </label>
            </p>

            <p>
                <label>
                    <strong>b)</strong> Evaluar si el valor de la variable cuenta es mayor que 10. De ser as&iacute;, imprimir "Cuenta es mayor que 10":<br>
                    <input type="text" value="if ( cuenta &gt; 10 ) document.writeln( &quot;Cuenta es mayor que 10&quot; );" size="55" readonly>
                </label>
            </p>

            <p>
                <label>
                    <strong>c)</strong> Decrementar la variable x en 1, luego restarla a la variable total. Usar s&oacute;lo una instrucci&oacute;n:<br>
                    <input type="text" value="total -= --x;" size="20" readonly>
                </label>
            </p>

            <p>
                <label>
                    <strong>d)</strong> Calcular el residuo despu&eacute;s de dividir q entre divisor y asignar el resultado a q. Escriba esta instrucci&oacute;n de dos maneras distintas:<br>
                    <input type="text" value="q %= divisor;  o  q = q % divisor;" size="35" readonly>
                </label>
            </p>
        </form>
