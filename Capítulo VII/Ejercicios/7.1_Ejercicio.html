<!-- Ejercicio 7.1: Completar enunciados -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 7.1</title>
    </head>

    <body>
        <h1>Ejercicio 7.1: Completar los enunciados</h1>
        <hr>

        <form>
            <p>
                <label>
                    <strong>a)</strong> Todas las secuencias de comandos pueden escribirse en términos de tres tipos de estructuras de control: 
                    <input type="text" value="Secuencia, selección y repetición" size="40" readonly>.
                </label>
            </p>

            <p>
                <label>
                    <strong>b)</strong> La instrucción de selección doble 
                    <input type="text" value="if...else" size="12" readonly> 
                    se utiliza para ejecutar una acción cuando una condición es verdadera, y otra acción cuando esa condición es falsa.
                </label>
            </p>

            <p>
                <label>
                    <strong>c)</strong> Al proceso de repetir un conjunto de instrucciones un número específico de veces se le llama repetición 
                    <input type="text" value="controlada por contador (o definida)" size="35" readonly>.
                </label>
            </p>

            <p>
                <label>
                    <strong>d)</strong> Cuando no se sabe de antemano cuántas veces se repetirá un conjunto de instrucciones, se puede usar un valor 
                    <input type="text" value="centinela (o de señal, bandera, prueba)" size="38" readonly> 
                    para terminar la repetición.
                </label>
            </p>
        </form>

        <hr>

    </body>
</html>
