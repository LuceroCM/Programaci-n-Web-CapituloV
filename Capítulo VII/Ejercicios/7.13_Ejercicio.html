<!DOCTYPE html>

<!-- Ejercicio 7.13: EjercicioNo7.13.html -->
<!-- Ingresos semanales de un vendedor por comisión. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ingresos de un vendedor</title>
      <h1>Ejercicio 7.13: Ingresos semanales de un vendedor por comisión</h1>
      <hr>
      <script>

         var articulo; // número del artículo vendido
         var ventasBrutas = 0; // suma de los valores de los artículos vendidos
         var ingresos; // ingresos de la semana

         // leer el primer artículo (-1 es el valor centinela)
         articulo = parseInt( window.prompt(
            "Número del artículo vendido (1 a 4). -1 para terminar:", "0" ) );

         while ( articulo != -1 )
         {
            if ( articulo == 1 )
               ventasBrutas += 239.99;
            else if ( articulo == 2 )
               ventasBrutas += 129.75;
            else if ( articulo == 3 )
               ventasBrutas += 99.95;
            else if ( articulo == 4 )
               ventasBrutas += 350.89;
            else
               window.alert( "Artículo inválido. Escriba 1, 2, 3 o 4." );

            // leer el siguiente artículo
            articulo = parseInt( window.prompt(
               "Número del artículo vendido (1 a 4). -1 para terminar:", "0" ) );
         } // fin de while

         // $200 por semana más el 9 por ciento de las ventas brutas
         ingresos = 200 + 0.09 * ventasBrutas;

         document.writeln( "<h1>Ingresos del vendedor</h1>" );
         document.writeln( "<p>Ventas brutas: $" + ventasBrutas + "</p>" );
         document.writeln( "<p>Ingresos de la semana: $" + ingresos + "</p>" );

      </script>
   </head>

   </body>
</html>
