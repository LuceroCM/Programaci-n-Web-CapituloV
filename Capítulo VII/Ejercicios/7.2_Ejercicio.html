<!-- Ejercicio 7.2: Instrucciones para sumar 1 a la variable x -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 7.2</title>
    </head>

    <body>
        <h1>Ejercicio 7.2: Instrucciones para sumar 1 a la variable x</h1>
        <hr>

        <form>
            <p>
                <strong>Escriba cuatro instrucciones de JavaScript que sumen 1, cada una, a la variable x, que contiene un número:</strong>
            </p>

            <p>
                <label>
                    1. 
                    <input type="text" value="x = x + 1;" size="15" readonly>
                </label>
            </p>

            <p>
                <label>
                    2. 
                    <input type="text" value="x += 1;" size="15" readonly>
                </label>
            </p>

            <p>
                <label>
                    3. 
                    <input type="text" value="++x;" size="15" readonly>
                </label>
            </p>

            <p>
                <label>
                    4. 
                    <input type="text" value="x++;" size="15" readonly>
                </label>
            </p>
        </form>

        <hr>

            <a href="7.3_Ejercicio.html" class="btn">Siguiente</a>
        </div>
    </body>
</html>
