<!DOCTYPE html>

<!-- Ciclo infinito que muestra los múltiplos de 2. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Múltiplos de 2 (ciclo infinito)</title>
      <h1>Ejercicio 7.21: Múltiplos de 2 (ciclo infinito)</h1>
      <hr>

      <script>

         var multiplo = 2;

         while ( true ) // la condición siempre es verdadera: ciclo infinito
         {
            document.writeln( "<p>" + multiplo + "</p>" );
            multiplo = multiplo * 2;
         } // fin de while

      </script>
   </head>
