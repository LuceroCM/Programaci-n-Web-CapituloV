<!DOCTYPE html>

<!-- Cifrado de un entero de cuatro dígitos. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Cifrado de un entero de cuatro dígitos</title>
      <h1>Ejercicio 7.22: Cifrado de un entero de cuatro dígitos</h1>
      <hr>
      <script>

         var entrada; // cadena escrita por el usuario
         var numero; // valor entero de la entrada
         var valido = false; // indica si el número es de cuatro dígitos
         var resto; // lo que queda del número al ir quitando dígitos
         var digito1, digito2, digito3, digito4;
         var temporal; // auxiliar para intercambiar dígitos
         var cifrado; // resultado como cadena de cuatro dígitos

         // pedir el número hasta que esté entre 0000 y 9999
         while ( valido == false )
         {
            entrada = window.prompt( "Escriba un entero de cuatro dígitos:", "0" );
            numero = parseInt( entrada );

            if ( numero >= 0 )
               if ( numero <= 9999 )
                  valido = true;

            if ( valido == false )
               window.alert(
                  "Escriba un entero de cuatro dígitos (0000 a 9999)." );
         } // fin de while

         // separar los dígitos
         digito4 = numero % 10;
         resto = ( numero - digito4 ) / 10;
         digito3 = resto % 10;
         resto = ( resto - digito3 ) / 10;
         digito2 = resto % 10;
         resto = ( resto - digito2 ) / 10;
         digito1 = resto;

         // reemplazar cada dígito con (dígito + 7) módulo 10
         digito1 = ( digito1 + 7 ) % 10;
         digito2 = ( digito2 + 7 ) % 10;
         digito3 = ( digito3 + 7 ) % 10;
         digito4 = ( digito4 + 7 ) % 10;

         // intercambiar el primer dígito con el tercero
         temporal = digito1;
         digito1 = digito3;
         digito3 = temporal;

         // intercambiar el segundo dígito con el cuarto
         temporal = digito2;
         digito2 = digito4;
         digito4 = temporal;

         // unir los dígitos como cadena para conservar los ceros iniciales
         cifrado = "" + digito1 + digito2 + digito3 + digito4;

         document.writeln( "<h1>Entero cifrado: " + cifrado + "</h1>" );

      </script>
   </head>

   </body>
</html>
