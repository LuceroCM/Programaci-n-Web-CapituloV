        <form>

                <strong>Determine el valor de cada variable despu&acute;s de realizar el c&aacute;lculo. Suponga que, cuando se empieza a ejecutar cada instrucci&oacute;n, todas las variables tienen el valor entero 5:</strong>
            </p>

            <p>
                <label>
                    <strong>a) producto *= x++;</strong><br>
                    <input type="text" value="producto = 25, x = 6" size="30" readonly>
                </label>
            </p>

            <p>
                <label>
                    <strong>b) cociente /= ++x;</strong><br>
                    <input type="text" value="cociente = 0.833333..., x = 6" size="35" readonly>
                </label>
            </p>
        </form>
