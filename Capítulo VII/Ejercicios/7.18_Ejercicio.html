<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 7.18</title>
        <h1>Ejercicio 7.18: Patrón de asteriscos y signos de mayor y menor</h1>
        <hr>
    </head>
    <body>
        <script>
            var fila = 10;
            var columna;

            while ( fila >= 1 )
            {
                columna = 1;
                document.writeln( "<p>" );

                while ( columna <= 10 )
                {
                    document.write( fila % 2 == 1 ? "<" : ">" );
                    ++columna;
                } // end while

                --fila;
                document.writeln( "</p>" );
            } // end while
        </script>

    </body>
</html>
