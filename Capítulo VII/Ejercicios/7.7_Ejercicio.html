    </head>

    <body>
        <h1>Ejercicio 7.7: Identificar y corregir errores</h1>
        <hr>

        <form>
            <p>
                <strong>Identifique y corrija los errores en cada uno de los siguientes segmentos de código:</strong>
            </p>

            <p>
                <label>
                    <strong>a) while ( c &lt;= 5 ) { producto *= c; ++c;</strong><br>
                    <strong>Error:</strong> Falta la llave derecha de cierre del cuerpo de la instrucción while.<br>
                    <strong>Corrección:</strong><br>
                    <input type="text" value="Agregar una llave derecha '}' después de la instrucción ++c;" size="55" readonly>
                </label>
            </p>

            <p>
                <label>
                    <strong>b) if ( genero == 1 ) document.writeln( "Mujer" ); else; document.writeln( "Hombre" );</strong><br>
                    <strong>Error:</strong> El punto y coma (;) después de else produce un error lógico; la segunda instrucción de salida siempre se ejecutará.<br>
                    <strong>Corrección:</strong><br>
                    <input type="text" value="Quitar el punto y coma después de else" size="40" readonly>
                </label>
            </p>
        </form>
