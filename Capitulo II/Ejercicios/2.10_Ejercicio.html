<!-- Ejercicio 2.10: Crear un documento que contenga el siguiente texto: -->
<!-- Identificar que cada uno de los objetos de HTML5 son un elemento o un atributo -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Elementos y atributos de HTML5</title>
    </head>

    <body>
        <h1> Ejercicio 2.10: Elementos y atributos de HTML5</h1>
        <hr>
        <h1>Identificación de Elementos y Atributos de HTML5</h1>
        <form>
            <p>
                <strong>a) html</strong><br><!-- Cambio de linea -->
                <label><input type="radio" name="html" value="elemento" checked> Elemento</label>
                <label><input type="radio" name="html" value="atributo"> Atributo</label>
            </p>

            <p>
                <strong>b) width</strong><br>
                <label><input type="radio" name="width" value="elemento"> Elemento</label>
                <label><input type="radio" name="width" value="atributo" checked> Atributo</label>
            </p>

            <p>
                <strong>c) href</strong><br>
                <label><input type="radio" name="href" value="elemento"> Elemento</label>
                <label><input type="radio" name="href" value="atributo" checked> Atributo</label>
            </p>

            <p>
                <strong>d) br</strong><br>
                <label><input type="radio" name="br" value="elemento" checked> Elemento</label>
                <label><input type="radio" name="br" value="atributo"> Atributo</label>
            </p>

            <p>
                <strong>e) h3</strong><br>
                <label><input type="radio" name="h3" value="elemento" checked> Elemento</label>
                <label><input type="radio" name="h3" value="atributo"> Atributo</label>
            </p>

            <p>
                <strong>f) a</strong><br>
                <label><input type="radio" name="a" value="elemento" checked> Elemento</label>
                <label><input type="radio" name="a" value="atributo"> Atributo</label>
            </p>

            <p>
                <strong>g) src</strong><br>
                <label><input type="radio" name="src" value="elemento"> Elemento</label>
                <label><input type="radio" name="src" value="atributo" checked> Atributo</label>
            </p>
        </form>

        <hr>

            <a href="2.11_Ejercicio.html" class="btn">Siguiente</a>
        </div>
    </body>
</html>
