<!-- Ejercicio 2.2: Completar oraciones -->
<!-- Complete las siguientes oraciones: -->
<html>
    <head>
        <meta charset="utf-8">
        <title>CompletarOraciones </title>
    </head>

    <body>
        <h1>Ejercicio 2.2: Completar las oraciones</h1>
        <hr>

        <form>
            <p>
                <label>
                    <strong>a)</strong> El elemento 
                    <input type="text" value="hr" size="10" readonly> 
                    inserta una regla horizontal.
                </label>
            </p>

            <p>
                <label>
                    <strong>b)</strong> Para marcar un super&iacute;ndice se utiliza el elemento 
                    <input type="text" value="sup" size="8" readonly> 
                    y para marcar un sub&iacute;ndice se utiliza el elemento 
                    <input type="text" value="sub" size="8" readonly>.
                </label>
            </p>

            <p>
                <label>
                    <strong>c)</strong> El elemento de encabezado menos importante es 
                    <input type="text" value="h6" size="8" readonly> 
                    y el elemento de encabezado m&aacute;s importante es 
                    <input type="text" value="h1" size="8" readonly>.
                </label>
            </p>

            <p>
                <label>
                    <strong>d)</strong> El elemento 
                    <input type="text" value="ul" size="10" readonly> 
                    marca una lista desordenada.
                </label>
            </p>

            <p>
                <label>
                    <strong>e)</strong> El elemento 
                    <input type="text" value="p" size="10" readonly> 
                    marca un p&aacute;rrafo.
                </label>
            </p>

            <p>
                <label>
                    <strong>f)</strong> El atributo 
                    <input type="text" value="type=&quot;reset&quot;" size="15" readonly> 
                    en un elemento input inserta un bot&oacute;n que, cuando se presiona, restablece el contenido del formulario.
                </label>
            </p>

            <p>
                <label>
                    <strong>g)</strong> El elemento 
                    <input type="text" value="tr" size="10" readonly> 
                    marca una fila de una tabla.
                </label>
            </p>

            <p>
                <label>
                    <strong>h)</strong> Los 
                    <input type="text" value="asteriscos (o puntos)" size="20" readonly> 
                    se usan por lo general como caracteres de enmascarado en un cuadro de contrase&ntilde;a.
                </label>
            </p>
        </form>
