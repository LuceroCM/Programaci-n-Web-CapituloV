<!-- Ejercicio 2.16: Formulario con campos de texto-->
<!-- Documento de HTML5 que permitaproveer retroalimentación-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Retroalimentaci&oacute;n </title>
    </head>

    <body>
        <h1>Ejercicio 2.16: Formulario de Retroalimentaci&oacute;n</h1>

        <form method="post" action="http://www.deitel.com">
            <p>
                <label>Nombre:<br>
                    <input type="text" name="nombre" size="30">
                </label>
            </p>

            <p>
                <label>Correo electr&oacute;nico:<br>
                    <input type="email" name="email" size="30">
                </label>
            </p>

            <p>
                <strong>&iquest;Qu&eacute; fue lo que m&aacute;s le gust&oacute; del campus?</strong><br>
                <label><input type="checkbox" name="gustos" value="campus"> Campus</label><br>
                <label><input type="checkbox" name="gustos" value="estudiantes"> Estudiantes</label><br>
                <label><input type="checkbox" name="gustos" value="ubicacion"> Ubicaci&oacute;n</label><br>
                <label><input type="checkbox" name="gustos" value="ambiente"> Ambiente</label><br>
                <label><input type="checkbox" name="gustos" value="dormitorios"> Dormitorios</label><br>
                <label><input type="checkbox" name="gustos" value="deportes"> Deportes</label>
            </p>

            <p>
                <strong>&iquest;C&oacute;mo supo sobre la universidad?</strong><br>
                <label><input type="radio" name="origen" value="amigos"> Amigos</label><br>
                <label><input type="radio" name="origen" value="television"> Televisi&oacute;n</label><br>
                <label><input type="radio" name="origen" value="internet"> Internet</label><br>
                <label><input type="radio" name="origen" value="otro"> Otro</label>
            </p>

            <p>
                <label>Comentarios adicionales:<br>
                    <textarea name="comentarios" rows="4" cols="40"></textarea>
                </label>
            </p>

            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Restablecer">
            </p>
        </form>

        <hr>
        <link rel="stylesheet" href="/Capitulo IV/Source/Botones.css">
        <div class="botones-navegacion">
            <a href="../index.html" class="btn">Menú principal</a>
            <a href="2.15_Ejercicio.html" class="btn">Anterior</a>
            <a href="2.17_Ejercicio.html" class="btn">Siguiente</a>
        </div>
    </body>
</html>
