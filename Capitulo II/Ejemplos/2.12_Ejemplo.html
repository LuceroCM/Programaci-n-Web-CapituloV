<!DOCTYPE html>

<!-- Fig. 2.12: formulario.html -->
<!-- Formulario con un campo de texto y campos ocultos. -->
<html>
    <head>
        <meta charset = "utf-8">
        <title>Formularios</title>
    </head>
    
    <body>
        <h1>Ejemplo 2.12: Formulario</h1>
        <hr> 

        <h1>Formulario de retroalimentaci&oacute;n</h1>
        <p>Llene este formulario para ayudarnos
           a mejorar nuestro sitio.</p>
           
        <!-- esta etiqueta empieza el formulario, índica el -->
        <!-- método de enviar información y la ubicación -->
        <!-- de la secuencia de comandos de procesamiento del formulario -->
        <form method="post" action="http://MM.deitel.com">
            <!-- las entradas ocultas contienen información -->
            <!-- no visual que también se enviará -->
            <input type = "hidden" name = "destinatario"
                value = "deitel@deitel.com">
            <input type = "hidden" name = "asunto"
                value = "Formulario de retroalimentaci&oacute;n">
            <input type = "hidden" name = "redirigir"
                value = "principal.html">

            <!-- <input type = “text"> inserta un campo de texto -->
            <p><label>Nombre: 
                    <input name = "nombre" type = "text" size = "25"
                        maxlength = "30">
                </label></p>
                <p>
                    <!-- los tipos de entrada “submit" y “reset" insertan -->
                    <!-- botones para enviar y borrar el contenido -->
                    <!-- del formulario, respectivamente -->
                    <input type = "submit" value = "Enviar">
                    <input type = "reset" value = "Borrar">
                </p>
        </form>

        <hr>
        <link rel="stylesheet" href="/Capitulo IV/Source/Botones.css">
        <div class="botones-navegacion">
            <a href="../index.html" class="btn">Menú principal II</a>
            <a href="2.11_Ejemplo.html" class="btn" >Anterior</a>
            <a href="2.13_Ejemplo.html" class="btn">Siguiente</a>
        </div>
    </body>
</html>
