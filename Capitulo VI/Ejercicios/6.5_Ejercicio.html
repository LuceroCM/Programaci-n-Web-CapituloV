      <h1> Ejercicio 6.5: Instrucciones para el producto de tres enteros </h1>
      <hr>

      <script>

    /*  Escriba una instrucción (o comentario) para realizar cada una de las siguientes tareas:
         a) Indique que una secuencia de comandos calculará el producto de tres enteros [Sugerencia: use texto que ayude a 
            documentar una secuencia de comandos].   
         b) Declare las variables x, y, z y resultado. */ 
         var xVal, yVal, zVal;                          // c) Declare las variables xVal, y Val y zVal.
         
         xVal = window.prompt( "Escriba el primer entero:", "0" );   // d) Pida al usuario que introduzca el primer valor, lea el valor del usuario y almacénelo en la variable xVal.
         
         yVal = window.prompt( "Escriba el segundo entero:", "0" );  // e) Pida al usuario que introduzca el segundo valor, lea d valor dd usuario y almacénelo en la variable yVal.
                                                                           
        zVal = window.prompt( "Escriba el tercer entero:", "0" );   // f) Pida al usuario que introduzca el tetcer valor, lea el valor del usuario y almacénelo en la variable zVal.
 
         x = parseInt( xVal );                          // g) Convierta la cadena xVal en un entero y almacene el resultado en la variable x.

         y = parseInt( yVal );                          // h) Convierta la cadena yVal en un entero y almacene el resultado en la variable y.

         z = parseInt( zVal );                          // i) Convierta la cadena zVal en un entero y almacene el resultado en la variable z.

         resultado = x * y * z;                         // j) Calcule el producto de los tres enteros contenidos en las variables x, y y z, y asigne el resultado a la variable resultado.
         document.writeln( "<h1>El producto es " + resultado + "</h1>" );  // k)

      </script>
