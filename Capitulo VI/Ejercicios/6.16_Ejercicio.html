<!DOCTYPE html>

<!-- Suma, producto, diferencia y cociente -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.16</title>
      <h1>Ejercicio 6.16: Suma, producto, diferencia y cociente</h1>
      <hr>

      <script>

         var n1 = parseFloat( window.prompt( "Escriba el primer número:", "0" ) );
         var n2 = parseFloat( window.prompt( "Escriba el segundo número:", "0" ) );
         document.writeln( "<h2>Resultados</h2>" );
         document.writeln( "<p>Suma: " + ( n1 + n2 ) + "</p>" );
         document.writeln( "<p>Producto: " + ( n1 * n2 ) + "</p>" );
         document.writeln( "<p>Diferencia: " + ( n1 - n2 ) + "</p>" );
         document.writeln( "<p>Cociente: " + ( n1 / n2 ) + "</p>" );

      </script>
   </head>
   <body>

</html>
