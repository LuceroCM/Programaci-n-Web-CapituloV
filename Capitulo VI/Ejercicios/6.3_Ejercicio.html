      <h1> Ejercicio 6.3: Instrucciones de JavaScript </h1>

      <script>
         // a) Declare las variables c, estaEsUnaVariable, q76354 y numero.
         var c, estaEsUnaVariable, q76354, numero;

         // b) Muestre un diálogo que pida al usuario que escriba un entero. Muestre un 
         // valor predeterminado de 0 en el diálogo. 
         var valorCadena = window.prompt( "Escriba un entero", "0" );

         // c) Convierta una cadena en un entero y almacene el valor convertido en la variable 
         // edad. Suponga que la cadena se almacena en valorCadena.
         var edad = parseInt( valorCadena );
         numero = edad;

         // d) Si la variable mumero no es igual a 7, muestre "La variable numero no es igual a 7" 
         // en un diálogo de mensaje,
         if ( numero != 7 )
            window.alert( "La variable numero no es igual a 7" );

         // e) Produzca una línea de texto de HTML5 que muestre el mensaje “Esto es JavaScript” 
         // en el documento de HTML5.
         document.writeln( "Esto es JavaScript" );

      </script>
