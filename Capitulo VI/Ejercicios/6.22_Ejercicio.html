<!DOCTYPE html>

<!-- Múltiplo -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.22</title>
      <h1>Ejercicio 6.22: Múltiplo</h1>
      <hr>

      <script>

         var a = parseInt( window.prompt( "Primer entero:", "0" ) );
         var b = parseInt( window.prompt( "Segundo entero:", "1" ) );
         if ( b == 0 )
            document.writeln( "<h2>No se puede dividir entre cero</h2>" );
         if ( b != 0 )
         {
            if ( a % b == 0 )
               document.writeln( "<h2>" + a + " es múltiplo de " + b + "</h2>" );
            if ( a % b != 0 )
               document.writeln( "<h2>" + a + " no es múltiplo de " + b + "</h2>" );
         }

      </script>
   </head>
