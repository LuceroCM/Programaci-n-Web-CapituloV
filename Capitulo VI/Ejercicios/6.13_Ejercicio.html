        <h1>Ejercicio 6.13: Instrucciones correctas para una ecuación</h1>
        <hr>

        <form>
            <p>
                <strong>Dada y = ax<sup>3</sup> + 7, ¿Cu&aacute;les de las siguientes instrucciones de JavaScript son correctas para esta ecuaci&oacute;n?</strong><br>
                <label><input type="checkbox" name="ej613" value="a" checked> a) y = a * x * x * x + 7; (Correcta)</label><br>
                <label><input type="checkbox" name="ej613" value="b"> b) y = a * x * x * (x + 7);</label><br>
                <label><input type="checkbox" name="ej613" value="c-primera" checked> c) y = (a * x) * x * (x + 7); (Opci&oacute;n alternativa 1)</label><br>
                <label><input type="checkbox" name="ej613" value="d" checked> d) y = (a * x) * x * x + 7; (Correcta)</label><br>
                <label><input type="checkbox" name="ej613" value="c-segunda" checked> e) y = a * (x * x * x) + 7; (Opción alternativa 2 - Correcta, eval&uacute;a el cubo entre par&eacute;ntesis)</label><br>
                
                <label><input type="checkbox" name="ej613" value="f"> f) y = a * x * x * (x * x + 7);</label>
            </p>
        </form>
