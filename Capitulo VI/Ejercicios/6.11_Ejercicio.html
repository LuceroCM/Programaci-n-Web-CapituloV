      <title>Ejercicio 6.11</title>
      <h1>Ejercicio 6.11: ¿Qué muestra cada alert?</h1>
      <hr>

      <script>

         var x = 2, y = 3;
         window.alert( "x = " + x );
         window.alert( "El valor de x + x es " + ( x + x ) );
         window.alert( "x =" );
         window.alert( ( x + y ) + " = " + ( y + x ) );

      </script>
