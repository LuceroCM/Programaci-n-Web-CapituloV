<!-- Menor y mayor de cinco enteros -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.20</title>
      <h1>Ejercicio 6.20: Menor y mayor de cinco enteros</h1>
      <hr>

      <script>

         var a = parseInt( window.prompt( "Entero 1:", "0" ) );
         var b = parseInt( window.prompt( "Entero 2:", "0" ) );
         var c = parseInt( window.prompt( "Entero 3:", "0" ) );
         var d = parseInt( window.prompt( "Entero 4:", "0" ) );
         var e = parseInt( window.prompt( "Entero 5:", "0" ) );
         var menor = a, mayor = a;
         if ( b < menor ) menor = b;
         if ( c < menor ) menor = c;
         if ( d < menor ) menor = d;
         if ( e < menor ) menor = e;
         if ( b > mayor ) mayor = b;
         if ( c > mayor ) mayor = c;
         if ( d > mayor ) mayor = d;
         if ( e > mayor ) mayor = e;
         document.writeln( "<p>El menor es " + menor + "</p>" );
         document.writeln( "<p>El mayor es " + mayor + "</p>" );

      </script>
   </head>
