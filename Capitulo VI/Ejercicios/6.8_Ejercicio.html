      <h1> Ejercicio 6.8: Instrucciones de JavaScript </h1>
      <hr>

      <script>

         // c) Indique que una secuencia de comandos va a realizar un cálculo de nómina de ejemplo.
         window.alert( "Escriba dos números" );                    // a) Muestre el mensaje “Escriba dos números" usando el objeto window.
         var b = parseInt( window.prompt( "Valor de b:", "0" ) );
         var c = parseInt( window.prompt( "Valor de c:", "0" ) );
         var a = b * c;                                             // b) Asigne el producto de las variables b y c a la variable a.
         document.writeln( "<p>a = b * c = " + a + "</p>" );

      </script>
