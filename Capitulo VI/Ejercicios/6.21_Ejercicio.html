   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.21</title>
      <h1>Ejercicio 6.21: Par o impar</h1>
      <hr>

      <script>

         var n = parseInt( window.prompt( "Escriba un entero:", "0" ) );
         if ( n % 2 == 0 )
            document.writeln( "<h2>" + n + " es par</h2>" );
         if ( n % 2 != 0 )
            document.writeln( "<h2>" + n + " es impar</h2>" );

      </script>
   </head>
