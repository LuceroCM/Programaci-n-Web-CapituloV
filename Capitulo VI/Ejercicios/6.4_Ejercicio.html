<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.4</title>

      <h1> Ejercicio 6.4: Identificación y corrección de errores</h1>
      <hr>

      <script>
         var c = parseInt( window.prompt( "Valor de c:", "0" ) );
        
         if ( c < 7 ) // a) Correción sin punto y coma tras la condición
            window.alert( "c es menor que 7" );
         
         if ( c >= 7 ) // b) Correción >= en lugar de =>
            window.alert( "c es igual o mayor que 7" );
      </script>
   </head>
