<!-- El número mayor -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.17</title>
      <h1>Ejercicio 6.17: El número mayor</h1>
      <hr>

      <script>

         var a = parseInt( window.prompt( "Primer entero:", "0" ) );
         var b = parseInt( window.prompt( "Segundo entero:", "0" ) );
         if ( a > b )
            window.alert( a + " es mayor que " + b );
         if ( b > a )
            window.alert( b + " es mayor que " + a );
         if ( a == b )
            document.writeln( "<h2>Estos números son iguales</h2>" );

      </script>
   </head>
