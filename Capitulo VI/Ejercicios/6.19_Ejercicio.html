<!DOCTYPE html>

<!-- Ejercicio 6.19: ejercicio_6_19.html -->
<!-- Diámetro, circunferencia y área -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.19</title>
      <h1>Ejercicio 6.19: Diámetro, circunferencia y área</h1>
      <hr>

      <script>

         var r = parseFloat( window.prompt( "Escriba el radio del círculo:", "1" ) );
         var PI = 3.14159;
         var diametro = 2 * r;
         var circunferencia = 2 * PI * r;
         var area = PI * r * r;
         document.writeln( "<h2>Círculo de radio " + r + "</h2>" );
         document.writeln( "<p>Diámetro: " + diametro + "</p>" );
         document.writeln( "<p>Circunferencia: " + circunferencia + "</p>" );
         document.writeln( "<p>Área: " + area + "</p>" );

      </script>
   </head>
