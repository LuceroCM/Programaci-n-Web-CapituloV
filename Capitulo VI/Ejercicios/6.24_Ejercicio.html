<!DOCTYPE html>

<!-- Tabla de cuadrados y cubos (0 a 5) -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.24</title>
      <h1>Ejercicio 6.24: Tabla de cuadrados y cubos (0 a 5)</h1>
      <hr>

      <script>

         document.writeln( "<table border='1'>" );
         document.writeln( "<tr><th>número</th><th>cuadrado</th><th>cubo</th></tr>" );
         document.writeln( "<tr><td>0</td><td>" + 0 * 0 + "</td><td>" + 0 * 0 * 0 + "</td></tr>" );
         document.writeln( "<tr><td>1</td><td>" + 1 * 1 + "</td><td>" + 1 * 1 * 1 + "</td></tr>" );
         document.writeln( "<tr><td>2</td><td>" + 2 * 2 + "</td><td>" + 2 * 2 * 2 + "</td></tr>" );
         document.writeln( "<tr><td>3</td><td>" + 3 * 3 + "</td><td>" + 3 * 3 * 3 + "</td></tr>" );
         document.writeln( "<tr><td>4</td><td>" + 4 * 4 + "</td><td>" + 4 * 4 * 4 + "</td></tr>" );
         document.writeln( "<tr><td>5</td><td>" + 5 * 5 + "</td><td>" + 5 * 5 * 5 + "</td></tr>" );
         document.writeln( "</table>" );

      </script>
   </head>
