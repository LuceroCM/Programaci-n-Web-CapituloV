<!DOCTYPE html>

<!-- Fig. 6.5: bienvenido4.html -->
<!-- Cuadro indicador utilizado en una pantalla de bienvenida -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Uso de cuadros prompt y alert</title>
        <link rel="stylesheet" href="/Capitulo IV/Source/Botones.css">
    </head>
    <body>
        <h1>Ejemplo 6.5: Uso de cuadros prompt y alert</h1>
        <hr>

        <script>
            var nombre; // cadena

            // lee el nombre del cuadro prompt como una cadena
            nombre = window.prompt("Escriba su nombre");

            // Validar si el usuario canceló o dejó vacío
            if (nombre) {
                document.writeln("<h1>Hola " + nombre + ", bienvenido a la programaci&oacute;n en JavaScript</h1>");
            } else {
                document.writeln("<h1>Hola invitado, bienvenido a la programaci&oacute;n en JavaScript</h1>");
            }
        </script>
        <hr>
        <link rel="stylesheet" href="/Capitulo IV/Source/Botones.css">
        <div class="botones-navegacion">
            <a href="../indexVI.html" class="btn">Menú principal VI</a>
            <a href="6.3_Ejemplo.html" class="btn">Anterior</a>
            <a href="6.5_Ejemplo.html" class="btn">Siguiente</a>
        </div>
    </body>
</html>
