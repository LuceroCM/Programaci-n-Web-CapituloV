    <body>
        <h1>Ejercicio 3.1: Completar las oraciones</h1>
        <hr>

        <form>
            <p>
                <label>
                    <strong>a)</strong> El tipo input color permite al usuario introducir un color. Al momento de escribir este libro, la mayor&iacute;a de los 
                                        navegadores despliegan el tipo input color como un campo de texto en donde el usuario puede introducir un 
                    <input type="text" value="código hexadecimal" size="15" readonly>. 
                </label>
            </p>

            <p>
                <label>
                    <strong>b)</strong> El atributo
                    <input type="text" value="placeholder" size="8" readonly> 
                    nos permite colocar texto temporal en un campo de texto. 
                </label>
            </p>

            <p>
                <label>
                    <strong>c)</strong> Si desea anular la validaci&oacute;n, puede agregard atributo formnovalidate al tipo input 
                    <input type="text" value="submit" size="8" readonly> 
                </label>
            </p>

            <p>
                <label>
                    <strong>d)</strong> El atributo 
                    <input type="text" value="required" size="5" readonly> 
                    obliga al usuario a introducir un valor antes de enviar el formulario.
                </label>
            </p>

            <p>
                <label>
                    <strong>e)</strong> Por lo general se muestra el control 
                    <input type="text" value="spinner" size="5" readonly> 
                    para el tipo input number e incluye s&oacute;lo los n&uacute;meros v&iacute;alidos.
                </label>
            </p>

            <p>
                <label>
                    <strong>f)</strong> El tipo input 
                    <input type="text" value="time" size="5" readonly> 
                    permite al usuario introducir una hora, minuto, segundo y fracci&oacute;n de segundo.
                </label>
            </p>

            <p>
                <label>
                    <strong>g)</strong> El elemento 
                    <input type="text" value="datalist" size="5" readonly> 
                    proporciona opciones de entrada para un elemento input text.
                </label>
            </p>

            <p>
                <label>
                    <strong>h)</strong> El elemento
                    <input type="text" value="article" size="5" readonly> 
                    describe contenido que est&aacute; separado del contenido principal de la p&aacute;gina y que 
                    posiblemente podr&iacute;a utilizarse o distribuirse en otra parte, como un art&iacute;culo de noticias, 
                    mensaje de foro o entrada de blog.
                </label>
            </p>

            <p>
                <label>
                    <strong>i)</strong> El elemento 
                    <input type="text" value="footer" size="5" readonly> 
                    describe el texto que por lo general aparece en la parte inferior del contenido o de un
                    elemento section
                </label>
            </p>

            <p>
                <label>
                    <strong>j)</strong> El elemento 
                    <input type="text" value="wbr" size="5" readonly> 
                    &iacute;ndica el lugar apropiada para dividir una palabra cuando el texto se ajusta en varias l&ntilde;neas
                </label>
            </p>
        </form>
