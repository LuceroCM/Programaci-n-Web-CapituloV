<!-- Ejercicio 3.8: Formulario autocomplete con un elemento datalist -->
<!-- Cree un demento input autocorplete con un elemento datalist asociado que contenga los dias de la semana.-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 3.8: Formulario autocomplete con un elemento datalist</title>
    </head>

    <body>
        <h1>Ejercicio 3.8: Formulario autocomplete con un elemento datalist</h1>
        <hr

        <form>
            <p>
                <label>Seleccione un d&iacute;a de la semana: 
                <input type="text" name="dia_semana" list="dias" placeholder="Seleccione o escriba..."></label>
            </p>
            <datalist id="dias">
                <option value="Lunes">
                <option value="Martes">
                <option value="Mi&eacute;rcoles">
                <option value="Jueves">
                <option value="Viernes">
                <option value="S&aacute;bado">
                <option value="Domingo">
            </datalist>
            <p>
                <input type="submit" value="Enviar">
            </p>
        </form>

        <hr>
        <link rel="stylesheet" href="/Capitulo IV/Source/Botones.css">

            <a href="3.9_Ejercicio.html" class="btn">Siguiente</a>
        </div>
    </body>
</html>
