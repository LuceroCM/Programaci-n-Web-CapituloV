    <body>
        <h1>Ejercicio 3.3: Completar las oraciones</h1>
        <hr>

        <form>
            <p>
                <label>
                    <strong>a)</strong> El atributo
                    <input type="text" value="autofocus" size="10" readonly>
                    (que se utiliza en un solo elemento input en un formulario) resalta de manera autom&aacute;tica
                    el elemento input y, si se usa de manera apropiada, coloca el cursor en el campo de texto 
                    despu&eacute;s de que el navegador carga y despliega la p&aacute;gina. 
                </label>
            </p>

            <p>
                <label>
                    <strong>b)</strong> Los nuevos tipos input de HTML5 tienen
                    <input type="text" value=" validación automática " size="18" readonly> 
                    del lado del cliente.
                </label>
            </p>

            <p>
                <label>
                    <strong>c)</strong> El tipo input
                    <input type="text" value="submit" size="8" readonly>
                    permite al usuario introducir un valor num&eacute;rico. 
                </label>
            </p>

            <p>
                <label>
                    <strong>d)</strong> El tipo input
                    <input type="text" value="number" size="5" readonly> 
                    se valida autom&aacute;ticamente de manera intr&iacute;nseca cuando lo despliega el navegador
                    como un control deslizante, ya que el usuario no puede mover el control fuera de los l&iacute;mites del valor m&iacute;nimo o 
                    m&aacute;ximo.
                </label>
            </p>

            <p>
                <label>
                    <strong>e)</strong> El atributo
                    <input type="text" value="autocomplete" size="10" readonly> 
                    puede usarse en los tipos input para completar de manera autom&aacute;tica la informaci&oacute;n
                    del usuario con base en datos de entrada anteriores.
                </label>
            </p>

            <p>
                <label>
                    <strong>f)</strong> El elemento 
                    <input type="text" value="figcaption" size="5" readonly> 
                    proporciona una leyenda para la imagen en el elemento figure.
                </label>
            </p>

            <p>
                <label>
                    <strong>g)</strong> El elemento summary muestra una flecha que apunta a la derecha enseguida de un resumen o leyenda cuando el 
                    documento x despliega en un navegador. Al hacer clic en la flecha, &eacute;sta apunta hacia abajo y revela el contenido 
                    del elemento 
                    <input type="text" value="details" size="5" readonly> 
                </label>
            </p>

            <p>
                <label>
                    <strong>h)</strong> El elemento mark nos permite
                    <input type="text" value="resaltar" size="5" readonly> 
                </label>
            </p>
        </form>
