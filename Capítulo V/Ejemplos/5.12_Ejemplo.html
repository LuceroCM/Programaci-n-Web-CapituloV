<!DOCTYPE html>

<!-- Fig. 5.13: inclinar.html -->
<!-- Elementos de inclinación y de transformación en CSS3. . -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Inclinar</title>
      <style>
         .textbox {
            margin-left: 75px;
            background: lightgreen;
            height: 100px;
            width: 200px;
            padding: 25px 0;
            text-align: center;
            font-size: 250%;
            border: 3px solid DarkGreen;
            border-radius: 15px;
            
            animation: skewAnim 3s infinite linear;
         }

         @keyframes skewAnim {
            from { transform: skewX(0deg); }
            25%  { transform: skewX(45deg); }
            50%  { transform: skewX(0deg); }
            75%  { transform: skewX(-45deg); }
            to   { transform: skewX(0deg); }
         }
      </style>
   </head>
   <body>
    <h1> Ejercicio 5.13: Inclinar</h1>
    <hr>
      <div class="textbox">Inclinar Texto</div>

      <hr>

            <a href="5.13_Ejemplo.html" class="btn">Siguiente</a>
        </div>
   </body>
</html>
