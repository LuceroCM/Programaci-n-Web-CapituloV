<!DOCTYPE html>

<!-- Fig. 5.4: gradientelineal.html -->
<!-- Gradientes lineales en CSS3. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Gradiente lineal</title>
      <style type = "text/css">
      div:not(.botones-navegacion)
      {
         width: 200px;
         height: 200px;
         border: 3px solid navy;
         padding: 5px 20px; 
         text-align: center;
         background: -webkit-gradient(
            linear, center top, center bottom,
            color-stop(15%, White), color-stop(50%, lightsteelblue),
            color-stop(75%, navy) );
         background: -moz-linear-gradient(
            top center, white 15%, lightsteelblue 50%, navy 75% );
         background: linear-gradient(
            top, White 15%, lightsteelblue 50%, navy 75% );
         float: left;
         margin-right: 15px;
      }
      #horizontal
      {
         width: 200px;
         height: 200px;
         border: 3px solid orange;
         padding: 5px 20px; 
         text-align: center;
         background: -webkit-gradient(
            linear, left top, right top,
            color-stop(15%, white), color-stop(50%, yellow),
            color-stop(75%, orange) );
         background: -moz-linear-gradient(
            left, white 15%, yellow 50%, orange 75% );
         background: linear-gradient(
            left, white 15%, yellow 50%, orange 75% );
         float: left; /* Añadido para asegurar el float */
         margin-right: 15px;
      }
      #diagonal
      {
         width: 200px;
         height: 200px;
         border: 3px solid purple;
         padding: 5px 20px; 
         text-align: center;
         background: -webkit-gradient(
            linear, left top, right bottom,
            color-stop(15%, white), color-stop(50%, plum),
            color-stop(75%, purple) );
         background: -moz-linear-gradient(
            top left, white 15%, plum 50%, purple 75% );
         background: linear-gradient(
            135deg, white 15%, plum 50%, purple 75% );
         float: left; /* Añadido para asegurar el float */
      }
      /* Esto obliga a que los botones bajen y no se metan en las cajas */
      .botones-navegacion {
         clear: both;
         padding-top: 30px;
      }
      </style>
   </head>
   <body>
    <h1> Ejemplo 5.4: Gradiente lineal</h1>
    <hr>

      <div><h2> Gradiente Lineal Vertical </h2></div>
      <div id = "horizontal"><h2>Gradiente Lineal Horizontal </h2></div>
      <div id = "diagonal"><h2>Gradiente Lineal Diagonal </h2></div>

      <hr style="clear: both; border: 0;">
      <hr>

      <link rel="stylesheet" href="/Capitulo IV/Source/Botones.css">
        <div class="botones-navegacion">
            <a href="../indexV.html" class="btn">Menú principal V</a>
            <a href="5.3_Ejemplo.html" class="btn">Anterior</a>
            <a href="5.5_Ejemplo.html" class="btn">Siguiente</a>
        </div>
   </body>
</html>
