<!DOCTYPE html>

<!-- Fig. 5.11: animacion.html -->
<!-- Animacion en CSS3. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Animación </title>
      <style type = "text/css">
         img
         {
            position: relative;
            -webkit-animation: movingimage linear 10s 1s 2 alternate;
            -moz-animation: movingimage linear 10s 1s 2 alternate;
            animation: movingimage linear 10s 1s 2 alternate;
         }
         @-webkit-keyframes movingimage 
         {
            0%   {opacity: 0; left: 50px; top: 0px;}
            25%  {opacity: 1; left: 0px; top: 50px;}
            50%  {opacity: 0; left: 50px; top: 100px;}
            75%  {opacity: 1; left: 100px; top: 50px;}
            100% {opacity: 0; left: 50px; top: 0px;}
         }
         @-moz-keyframes movingimage 
         {
            0%   {opacity: 0; left: 50px; top: 0px;}
            25%  {opacity: 1; left: 0px; top: 50px;}
            50%  {opacity: 0; left: 50px; top: 100px;}
            75%  {opacity: 1; left: 100px; top: 50px;}
            100% {opacity: 0; left: 50px; top: 0px;}
         }
         @keyframes movingimage
         {
            0%   {opacity: 0; left: 50px; top: 0px;}
            25%  {opacity: 1; left: 0px; top: 50px;}
            50%  {opacity: 0; left: 50px; top: 100px;}
            75%  {opacity: 1; left: 100px; top: 50px;}
            100% {opacity: 0; left: 50px; top: 0px;}
         }
         
         .botones-navegacion {
            margin-top: 100px;
            clear: both;
         }
      </style>
   </head>
   <body>
    <h1> Ejemplo 5.11: Animación </h1>
    <hr>
      <img src = "../Source/jhtp.png" width = "138" height = "180"
         alt = "Java How to Program book cover">
      <div></div>

      <hr style="clear: both; border: 0;">
      
      <link rel="stylesheet" href="/Capitulo IV/Source/Botones.css">
        <div class="botones-navegacion">
            <a href="../indexV.html" class="btn">Menú principal V</a>
            <a href="5.9_Ejemplo.html" class="btn">Anterior</a>
            <a href="5.11_Ejemplo.html" class="btn">Siguiente</a>
        </div>
   </body>
</html>
