<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Borde de Imagen</title>
      <style type="text/css">
         
         div:not(.botones-navegacion) {
            border-width: 30px;
            border-style: solid; 
            width: 234px;
            padding: 20px;
            margin-bottom: 20px;
         }
         #stretch {
            border-image: url('../Source/borde.png') 80 80 80 80 stretch;
         }
         #repeat {
            border-image: url('../Source/borde.png') 34% 34% repeat;
         }
         /* Limpiamos cualquier flujo flotante y damos espacio a la navegación */
         .botones-navegacion {
            clear: both;
            margin-top: 20px;
         }
      </style>
   </head>
   <body>
      <h1>Ejemplo 5.10: Borde de Imagen</h1>
      <hr>
      
      <h2>Borde de Imagen</h2>
      <img src="../Source/borde.png" alt="imagen utilizada para demostrar los bordes">
      
      <div id="stretch">Se estira el borde de la imagen</div>
      <div id="repeat">Se repite el borde de la imagen</div>

      <hr style="clear: both; border: 0;">
      <hr>

      <link rel="stylesheet" href="/Capitulo IV/Source/Botones.css">
        <div class="botones-navegacion">
            <a href="../indexV.html" class="btn">Menú principal V</a>
            <a href="5.8_Ejemplo.html" class="btn">Anterior</a>
            <a href="5.10_Ejemplo.html" class="btn">Siguiente</a>
        </div>
   </body>
</html>
