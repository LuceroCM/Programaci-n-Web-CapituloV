<!-- Ejercicio 5.11: EjercicioNo5.11.html -->
<!-- Fusionar cinco imágenes mediante CSS3 (modificación de la figura 5.14). -->
<html lang = "es">
   <head>
      <meta charset = "utf-8">
      <title>Fusión de cinco im&aacute;genes</title>
      <style type = "text/css">
         #fotos
         {
            position: relative;
            width: 500px; 
            height: 400px;  
            margin: 0 auto;
         }
         #fotos img
         {
            position: absolute;
            left: 0;
            top: 0;
            width: 500px; 
            height: 400px; 
            object-fit: cover;    /* <-- Para que la imagen se ajuste sin deformarse */
            -webkit-transition-property: opacity;
            -webkit-transition-duration: 3s;
            -webkit-transition-timing-function: linear;
            transition-property: opacity;
            transition-duration: 3s;
            transition-timing-function: linear;
         }

         /* orden de apilamiento: la imagen 1 queda arriba y la 5 abajo */
         .foto1 { z-index: 5; }
         .foto2 { z-index: 4; }
         .foto3 { z-index: 3; }
         .foto4 { z-index: 2; }
         .foto5 { z-index: 1; }

         /* al pasar el ratón, cada imagen se desvanece en su turno */
         #fotos:hover .foto1 { opacity: 0; }
         #fotos:hover .foto2 { opacity: 0;
            -webkit-transition-delay: 3s; transition-delay: 3s; }
         #fotos:hover .foto3 { opacity: 0;
            -webkit-transition-delay: 6s; transition-delay: 6s; }
         #fotos:hover .foto4 { opacity: 0;
            -webkit-transition-delay: 9s; transition-delay: 9s; }
         footer { clear: both; margin-top: 40px; font-family: sans-serif; }
      </style>
   </head>
   <body>
      <h1> Ejercicio 5.11: Fusi&oacute;n de 5 im&aacute;genes </h1>
      <hr>

      <div id = "fotos">
         <img class = "foto1" src = "../Source/Etapa1.jpg" alt = "Fotograf&iacute;a 1 de 5">
         <img class = "foto2" src = "../Source/Etapa2.jpg" alt = "Fotograf&iacute;a 2 de 5">
         <img class = "foto3" src = "../Source/Etapa3.jpg" alt = "Fotograf&iacute;a 3 de 5">
         <img class = "foto4" src = "../Source/Etapa4.jpg" alt = "Fotograf&iacute;a 4 de 5">
         <img class = "foto5" src = "../Source/Etapa5.jpg" alt = "Fotograf&iacute;a 5 de 5">
      </div>

            <a href="5.12_Ejercicio.html" class="btn">Siguiente</a>
        </div>
   </body>
</html>
