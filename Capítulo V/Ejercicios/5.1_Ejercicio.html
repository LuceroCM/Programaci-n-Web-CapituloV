    <head>
        <meta charset="utf-8">
        <title>Ejercicio 5.1 - Completar Oraciones</title>
    </head>

    <body>

        <h1>Ejercicio 5.1: Completar oraciones</h1>
        <hr>

        <form>
            <p>
                <label>
                    <strong>a)</strong> La propiedad 
                    <input type="text" value="text-shadow" size="11" readonly>
                    facilita la acción de agregar un efecto de sombra a cualquier texto.
                </label>
            </p>

            <p>
                <label>
                    <strong>b)</strong> La propiedad 
                    <input type="text" value="border-radius" size="13" readonly> 
                    nos permite agregar esquinas redondeadas a cualquier elemento.
                </label>
            </p>

            <p>
                <label>
                    <strong>c)</strong> CSS3 incluye dos nuevas formas de expresar el color: 
                    <input type="text" value="RGBA" size="4" readonly> y 
                    <input type="text" value="HSLA" size="4" readonly>
                </label>
            </p>

            <p>
                <label>
                    <strong>d)</strong> El 
                    <input type="text" value="desplazamiento horizontal" size="23" readonly> 
                    define el número de píxeles que aparecerá el elemento box-shadow a la izquierda o a la derecha de la caja.
                </label>
            </p>

            <p>
                <label>
                    <strong>e)</strong> Los 
                    <input type="text" value="gradientes radiales" size="18" readonly> 
                    son similares a los gradientes lineales, sólo que el color cambia en forma gradual desde un círculo interno (el inicio) hacia un círculo externo (el final).
                </label>
            </p>

            <p>
                <label>
                    <strong>f)</strong> La propiedad 
                    <input type="text" value="border-image-slice" size="18" readonly> 
                    divide la imagen en nueve regiones: cuatro esquinas, cuatro lados y una parte media, que es transparente a menos que se especifique lo contrario.
                </label>
            </p>

            <p>
                <label>
                    <strong>g)</strong> La propiedad animation-timing-function determina cómo progresa la animación en un ciclo de su duración. Los posibles valores son 
                    <input type="text" value="linear" size="6" readonly>, 
                    <input type="text" value="ease" size="4" readonly>, 
                    <input type="text" value="ease-in" size="7" readonly>, 
                    <input type="text" value="ease-out" size="8" readonly>, 
                    <input type="text" value="ease-in-out" size="11" readonly> y 
                    <input type="text" value="cubic-bezier" size="12" readonly>.
                </label>
            </p>

            <p>
                <label>
                    <strong>h)</strong> Para el elemento que se va a animar, la 
                    <input type="text" value="regla @keyframes" size="15" readonly> 
                    define las propiedades de los elementos que cambiarán durante la animación, los valores a los que cambiarán esas propiedades y cuándo lo harán.
                </label>
            </p>

            <p>
                <label>
                    <strong>i)</strong> Las 
                    <input type="text" value="transiciones" size="12" readonly> 
                    son similares en concepto a las animaciones, pero nos permiten especificar sólo los valores iniciales y finales de las propiedades de CSS que van a cambiarse. Los cuadros clave de una animación nos permiten controlar los estados intermedios a lo largo de la duración de la animación.
                </label>
            </p>

            <p>
                <label>
                    <strong>j)</strong> Las 
                    <input type="text" value="transformaciones" size="15" readonly> 
                    de CSS3 nos permiten mover, girar, escalar e inclinar elementos.
                </label>
            </p>

            <p>
                <label>
                    <strong>k)</strong> Las 
                    <input type="text" value="reglas" size="6" readonly> 
                    consisten en uno o más selectores seguidos de un bloque de declaraciones entre llaves ({}).
                </label>
            </p>

            <p>
                <label>
                    <strong>l)</strong> En CSS3 podemos usar 
                    <input type="text" value="selectores" size="10" readonly> 
                    para aplicar estilo a los atributos con facilidad.
                </label>
            </p>
        </form>

        </div>
    </body>
</html>
