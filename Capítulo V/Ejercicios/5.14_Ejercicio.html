<!-- Ejercicio 5.14: Ejercicio.html -->
<!-- Aumentar 20% el tamaño de una imagen al pasar el ratón. -->
<html lang = "es">
   <head>
      <meta charset = "utf-8">
      <title>Transformación con hover</title>
      <style type = "text/css">
         img
         {
            margin: 30px;
            -webkit-transition: -webkit-transform 0.4s;
            -moz-transition: -moz-transform 0.4s;
            -o-transition: -o-transform 0.4s;
            transition: transform 0.4s;
         }
         img:hover
         {
            -webkit-transform: scale(1.2, 1.2);
            -moz-transform: scale(1.2, 1.2);
            -o-transform: scale(1.2, 1.2);
            transform: scale(1.2, 1.2);
         }
         footer { clear: both; margin-top: 40px; font-family: sans-serif; }
      </style>
   </head>
   <body>
      <h1> Ejercicio 5.14: Transformación con hover</h1>
      <hr>
      
      <img src = "../Source/oceano.png" width = "180" height = "120" alt = "Imagen 1">
      <img src = "../Source/Mar.jpeg" width = "180" height = "120" alt = "Imagen 2">
      <img src = "../Source/Mar2.jpeg" width = "180" height = "120" alt = "Imagen 3">
      <img src = "../Source/Mar3.jpeg" width = "180" height = "120" alt = "Imagen 4">

   </body>
</html>
